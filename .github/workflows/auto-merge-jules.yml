name: auto-merge-jules
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  automerge:
    if: contains(github.event.pull_request.user.login, 'jules')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PERSONAL_MERGE_TOKEN }}
        run: gh pr merge --merge --auto "${{ github.event.pull_request.number }}" --repo ${{ github.repository }}
